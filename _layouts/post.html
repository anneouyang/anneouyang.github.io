---
layout: default
---

<h1 style="margin-bottom: 0.67em">
  {{ page.title }}
</h1>

<span class="post-date">{{ page.date | date_to_string }} - 
  {% for tag in page.tags %}
    <a href="{{ site.github.url }}/tags#{{tag}}">#{{ tag }} </a>
  {% endfor %}
</span>

{% if page.image %}
  <img src="{{ site.github.url }}/assets/img/{{ page.image }}">
{% endif %}

{{ content }}
